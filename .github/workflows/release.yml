name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2026.6.0)'
        required: true

env:
  # Pin versions for cache keys — bump these to force a rebuild
  LSMASH_REF: master
  M4ACUT_REF: master
  ATOMICPARSLEY_VERSION: '20240608.083822'
  # Static, self-contained build id — see scripts/fetch-binaries.sh (FFMPEG_BUILD).
  # Bump this whenever that pin changes so the native-binary cache invalidates.
  FFMPEG_VERSION: '1781693612_N-125070-gd69e8d0a95'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve yt-dlp version
        id: ytdlp
        run: echo "version=$(grep -E '^YTDLP_VERSION=' scripts/fetch-binaries.sh | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          # Node 22 (prior LTS): electron-packager's finalize step exits prematurely on
          # Node 24 when signing widens the async window (electron/forge#3690).
          # Node 20 is too old — pnpm 11.9 requires Node >= 22.13.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Cache native binaries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: resources/bin/darwin
          key: native-bins-${{ runner.os }}-${{ runner.arch }}-lsmash-${{ env.LSMASH_REF }}-m4acut-${{ env.M4ACUT_REF }}-ap-${{ env.ATOMICPARSLEY_VERSION }}-ytdlp-${{ steps.ytdlp.outputs.version }}-ffmpeg-${{ env.FFMPEG_VERSION }}

      - name: Compile m4acut
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          brew install automake libtool
          git clone https://github.com/l-smash/l-smash.git /tmp/l-smash
          cd /tmp/l-smash
          ./configure
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          git clone https://github.com/nu774/m4acut.git /tmp/m4acut
          cd /tmp/m4acut
          autoreconf -fi
          ./configure LIBS="-liconv"
          make -j$(sysctl -n hw.ncpu)
          cp m4acut $GITHUB_WORKSPACE/resources/bin/darwin/m4acut
          chmod +x $GITHUB_WORKSPACE/resources/bin/darwin/m4acut

      - name: Install AtomicParsley
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          brew install atomicparsley
          cp $(which AtomicParsley) resources/bin/darwin/AtomicParsley
          chmod +x resources/bin/darwin/AtomicParsley

      - name: Install yt-dlp
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${{ steps.ytdlp.outputs.version }}/yt-dlp_macos" \
            -o resources/bin/darwin/yt-dlp
          chmod +x resources/bin/darwin/yt-dlp

      - name: Install ffmpeg and ffprobe
        if: steps.native-cache.outputs.cache-hit != 'true'
        # Static, self-contained build (NOT Homebrew — its dylibs live outside the
        # .app and would make yt-dlp report "ffprobe and ffmpeg not found" on user
        # machines). Pin + checksums live in scripts/fetch-binaries.sh.
        run: bash scripts/fetch-binaries.sh ffmpeg

      - name: Validate bundled binaries are self-contained
        # Now that every binary is provisioned (fresh or from cache), assert each
        # is present, arm64, and links nothing outside the system frameworks —
        # before we sign and package. REQUIRE_BUNDLED_BINARIES makes absence fatal
        # here (in the fast unit lane these are gitignored, so the checks skip).
        env:
          REQUIRE_BUNDLED_BINARIES: '1'
        run: npx vitest run test/build/bundled-binaries.test.ts

      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # Confirm the Developer ID identity is actually present + visible to codesign.
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Expose the keychain to the signing config (osx-sign otherwise only checks login.keychain).
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build DMG and ZIP
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Surface a swallowed promise rejection in the sign/notarize chain instead of
          # letting `make` exit 0 with no distributables.
          NODE_OPTIONS: '--unhandled-rejections=strict'
        run: pnpm run make

      - name: Verify build produced artifacts
        run: |
          set -uo pipefail
          dmg="$(find out/make -name '*.dmg' -type f 2>/dev/null | head -1)"
          zip="$(find out/make -name '*.zip' -type f 2>/dev/null | head -1)"
          echo "dmg: ${dmg:-none}"
          echo "zip: ${zip:-none}"
          if [ -z "$dmg" ] || [ -z "$zip" ]; then
            echo "::error::make produced no .dmg/.zip — refusing to publish an empty release"
            echo "--- out/ tree ---"; find out -maxdepth 5 2>/dev/null | head -80 || true
            exit 1
          fi

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.dmg
            out/make/zip/darwin/**/*.zip
